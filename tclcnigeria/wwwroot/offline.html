<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCLC Nigeria — Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #070D2E;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        button {
            background: #F5C842;
            color: #070D2E;
            border: none;
            border-radius: 50px;
            padding: 14px 36px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you've lost your internet connection.<br>
            Some content may still be available from cache.
        </p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
